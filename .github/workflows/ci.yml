name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # Built from tools/go.mod so the linter version is the one dependabot
      # tracks, and is identical to what `task lint` runs locally.
      - run: go -C tools build -o ../bin/ github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - run: ./bin/golangci-lint run ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.27.x", "1.26.x"]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - run: go test -tags integration -race -count=1 ./...

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # The same task developers run, so the sqlc guard and the generator
      # arguments have one definition. Task builds the generators itself.
      - run: go -C tools build -o ../bin/ github.com/go-task/task/v3/cmd/task
      - run: ./bin/task generate:check

  # forge:begin init
  # Every way `forge init` can shape a project must lint, build and pass its
  # tests, including on a real Postgres, and `forge add resource` must stamp a
  # module that compiles and lints in each of those shapes. Removed by init
  # itself.
  init:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        drop:
          - ""
          - "example,outbox,idempotency,otlp,admin"
          - "outbox,idempotency,otlp,admin"
          - "example"
          - "example,idempotency,otlp,admin"
          - "example,outbox,otlp,admin"
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go run ./cmd/forge init -yes -module github.com/example/app -drop "${{ matrix.drop }}"
      - run: go run ./cmd/forge add resource Order
      - run: go -C tools build -o ../bin/ github.com/go-task/task/v3/cmd/task
      - run: ./bin/task generate
      - run: go -C tools build -o ../bin/ github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - run: ./bin/golangci-lint run ./...
      - run: go test ./...
      - run: go test -tags integration -count=1 ./...
      - run: docker compose -f deployments/docker-compose.yml --profile "*" config --quiet
  # forge:end init

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Nothing else builds deployments/Dockerfile, so a base-image bump or a
      # broken build stage would otherwise reach main unnoticed. Build only, the
      # image is never pushed from CI.
      - run: docker build -f deployments/Dockerfile -t go-api-scaffolding:ci .

  # Its own job so a broken deployments/Dockerfile does not mask the compose
  # signal: the two are most likely to be touched in the same PR.
  compose:
    runs-on: ubuntu-latest
    env:
      # Every profile, so a service added behind a future profile keeps being
      # validated without anyone remembering to extend this job.
      COMPOSE_PROFILES: "*"
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # docker-compose.yml is only ever run by hand through `task up`, so a
      # broken service definition or interpolation would go unnoticed here.
      - run: docker compose -f deployments/docker-compose.yml config --quiet
      # config never resolves image references, so an image bump to a tag that
      # does not exist would still reach main and only fail at `task up`.
      - run: docker compose -f deployments/docker-compose.yml pull --quiet

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # release.yml only runs on a tag, so a broken .goreleaser.yaml would first
      # surface during a release. Validate it here with the same action and
      # version range the release itself uses.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: check

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # Pinned in tools/go.mod rather than @latest, so a scan is reproducible
      # and a scanner release cannot turn CI red on its own.
      - run: go -C tools build -o ../bin/ golang.org/x/vuln/cmd/govulncheck
      - run: ./bin/govulncheck ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - run: go build ./...

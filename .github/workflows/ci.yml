name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copilot-setup:
    uses: ./.github/workflows/copilot-setup-steps.yml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # Built from tools/go.mod so the linter version is the one dependabot
      # tracks, and is identical to what `task lint` runs locally.
      - run: go -C tools build -o ../bin/ github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - run: ./bin/golangci-lint run ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.27.x", "1.26.x"]
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      # Exercise the selected minimum/stable line instead of auto-upgrading
      # both matrix entries to go.mod's preferred toolchain.
      - run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...
        env:
          GOTOOLCHAIN: local

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - run: go test -tags integration -race -count=1 ./...

  platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # Go-only bootstrap also installs Task. The exact generator toolchain is
      # selected from tools/go.mod, even when the runner has a newer Go patch.
      - run: go run ./cmd/dev bootstrap
      - run: go run ./cmd/dev check
      - run: git diff --exit-code

  # Keep the existing required status name while requiring every OS in the
  # platform matrix. A failed, skipped, or cancelled matrix must not pass it.
  generate:
    needs: [platform]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform check
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$PLATFORM_RESULT" = success

  integration-external:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_USER: forge_test
          POSTGRES_PASSWORD: forge_test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      FORGE_TEST_DATABASE_URL: postgres://forge_test:forge_test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - run: go test -tags integration -race -count=1 ./...

  # forge:begin example
  docker-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - run: go test -tags e2e -count=1 -timeout 15m ./cmd/api
  # forge:end example

  # forge:begin init
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: docs
          destination: tmp/site

  eval-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m unittest discover -s evals -p 'test_*.py'

  generated-api:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go run ./cmd/dev bootstrap
      - run: go test -tags generator -count=1 ./cmd/forge

  # Representative combinations of optional components must lint, build and
  # pass tests against real Postgres. Generated resources must work in each
  # selected combination. Removed by init itself.
  init:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        drop:
          - ""
          - "example,outbox,idempotency,otlp,admin"
          - "outbox,idempotency,otlp,admin"
          - "example"
          - "example,idempotency,otlp,admin"
          - "example,outbox,otlp,admin"
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go run ./cmd/forge init -yes -module github.com/example/app -drop "${{ matrix.drop }}"
      - run: go run ./cmd/forge add resource Order
      - run: go -C tools build -o ../bin/ github.com/go-task/task/v3/cmd/task
      - run: ./bin/task generate
      - run: go -C tools build -o ../bin/ github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - run: ./bin/golangci-lint run ./...
      - run: go test ./...
      - run: go test -tags integration -count=1 ./...
      - run: docker compose -f deployments/docker-compose.yml --profile "*" config --quiet
  # forge:end init

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Nothing else builds deployments/Dockerfile, so a base-image bump or a
      # broken build stage would otherwise reach main unnoticed. Build only, the
      # image is never pushed from CI.
      - run: docker build -f deployments/Dockerfile -t gophling:ci .

  # Its own job so a broken deployments/Dockerfile does not mask the compose
  # signal: the two are most likely to be touched in the same PR.
  compose:
    runs-on: ubuntu-latest
    env:
      # Every profile, so a service added behind a future profile keeps being
      # validated without anyone remembering to extend this job.
      COMPOSE_PROFILES: "*"
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # docker-compose.yml is only ever run by hand through `task up`, so a
      # broken service definition or interpolation would go unnoticed here.
      - run: docker compose -f deployments/docker-compose.yml config --quiet
      # forge:begin otlp
      # Architecture-specific tags can pull on CI while breaking ARM developers.
      - run: python .github/scripts/check_image_platforms.py deployments/docker-compose.yml otel-collector
      # forge:end otlp
      # config never resolves image references, so an image bump to a tag that
      # does not exist would still reach main and only fail at `task up`.
      - run: docker compose -f deployments/docker-compose.yml pull --quiet

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      # release.yml only runs on a tag, so a broken .goreleaser.yaml would first
      # surface during a release. Validate it here with the same action and
      # pinned version the release itself uses.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: check

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # Pinned in tools/go.mod rather than @latest, so a scan is reproducible
      # and a scanner release cannot turn CI red on its own.
      - run: go -C tools build -o ../bin/ golang.org/x/vuln/cmd/govulncheck
      - run: ./bin/govulncheck ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - run: go build ./...

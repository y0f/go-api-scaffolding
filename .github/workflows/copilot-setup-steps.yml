name: Copilot setup steps

# CI calls this workflow so setup changes can be tested before reaching main.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # GitHub recognizes this exact job name for Actions-backed agent sessions.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Install pinned development tools
        run: go run ./cmd/dev bootstrap
      - name: Download application dependencies
        run: go mod download
      - name: Report available prerequisites
        run: go run ./cmd/dev doctor

name: forge

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      # Postgres 18 stores data in a major-version subdirectory and refuses to
      # start against a mount at the old /var/lib/postgresql/data path, so the
      # volume goes one level up.
      - pgdata:/var/lib/postgresql

  migrate:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    entrypoint: ["/migrate"]
    command: ["up"]
    environment:
      FORGE_DB_URL: postgres://forge:forge@postgres:5432/forge?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    environment:
      FORGE_ENV: development
      FORGE_DB_URL: postgres://forge:forge@postgres:5432/forge?sslmode=disable
      FORGE_OTEL_OTLP_ENDPOINT: ${FORGE_OTEL_OTLP_ENDPOINT:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "8888:8888"

  tempo:
    image: grafana/tempo:3.0.3
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.2.1
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      # Only the datasources directory: mounting all of provisioning hides the
      # image's own empty dashboards/plugins/alerting dirs and Grafana logs an
      # error for each at startup.
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  pgdata:

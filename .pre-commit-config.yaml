repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
  - repo: local
    hooks:
      # Through task, so these run the versions pinned in tools/go.mod rather
      # than whatever happens to be on PATH.
      - id: fmt
        name: gofumpt and goimports
        entry: task fmt
        language: system
        types: [go]
        pass_filenames: false
      - id: lint
        name: golangci-lint
        entry: task lint
        language: system
        types: [go]
        pass_filenames: false
      - id: vuln
        name: govulncheck
        entry: task vuln
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]

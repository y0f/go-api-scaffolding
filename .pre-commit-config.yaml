repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
  - repo: local
    hooks:
      # Through the task pinned in tools/go.mod (run with `go tool`), so these
      # use the pinned versions and need no task install on PATH.
      - id: fmt
        name: gofumpt and goimports
        entry: go -C tools tool task -d .. fmt
        language: system
        types: [go]
        pass_filenames: false
      - id: lint
        name: golangci-lint
        entry: go -C tools tool task -d .. lint
        language: system
        types: [go]
        pass_filenames: false
      - id: vuln
        name: govulncheck
        entry: go -C tools tool task -d .. vuln
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]

root = "."
tmp_dir = "tmp"

[build]
  # Output to the directory, so Go names the binary api or api.exe per OS.
  cmd = "go build -o ./tmp/ ./cmd/api"
  bin = "./tmp/api"
  delay = 200
  include_ext = ["go"]
  exclude_dir = ["bin", "dist", "tmp", "deployments", "docs"]
  exclude_regex = ["_test\\.go"]
  stop_on_error = true

[misc]
  clean_on_exit = true

version: "3"

# Loaded for every task, so the .env described in .env.example is what
# `task run`, `task dev` and `task migrate` actually read.
dotenv: [".env"]

vars:
  BINARY: api
  # Developer tools are pinned in tools/go.mod and built into ./bin, so the
  # versions here, in CI and on every machine are the same ones dependabot
  # updates. Never call a tool off $PATH.
  TOOLS: ./bin
  EXT: '{{if eq OS "windows"}}.exe{{end}}'
  PKG: ./cmd/api
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X github.com/y0f/gophling/internal/config.version={{.VERSION}}

tasks:
  default:
    cmds:
      - '"{{.TASK_EXE}}" --list'
    silent: true

  setup:
    desc: Build the pinned developer toolchain into ./bin
    cmds:
      - go run ./cmd/dev bootstrap

  doctor:
    desc: Report Go, Git, pinned tools, Docker and race-test prerequisites
    cmds:
      - go run ./cmd/dev doctor

  check:
    desc: Check generation, lint, unit tests and build (no Docker needed)
    cmds:
      - go run ./cmd/dev check

  generate:
    desc: Regenerate type-safe DB and API code from SQL and the OpenAPI spec
    cmds:
      - go run ./cmd/dev generate

  generate:check:
    desc: Fail if generated code is out of date with its sources
    cmds:
      - go run ./cmd/dev generate-check

  fmt:
    desc: Format code with gofumpt and goimports
    deps: [setup]
    cmds:
      - "{{.TOOLS}}/golangci-lint{{.EXT}} fmt ./..."

  lint:
    desc: Run the linter
    deps: [setup]
    cmds:
      - "{{.TOOLS}}/golangci-lint{{.EXT}} run ./..."

  vuln:
    desc: Scan for known vulnerabilities reachable from the code
    deps: [setup]
    cmds:
      - "{{.TOOLS}}/govulncheck{{.EXT}} ./..."

  test:
    desc: Run unit tests with coverage
    cmds:
      - go test -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...

  test:race:
    desc: Run unit tests under the race detector (needs a C toolchain, as CI has)
    env:
      CGO_ENABLED: "1"
    cmds:
      - go test -race -shuffle=on ./...

  test:integration:
    desc: Run integration tests (Docker or FORGE_TEST_DATABASE_URL)
    cmds:
      - go test -tags integration -count=1 ./...

  # forge:begin example
  test:e2e:
    desc: Build and exercise the full API in an isolated Docker Compose project
    cmds:
      - go test -tags e2e -count=1 -timeout 15m ./cmd/api
  # forge:end example

  # forge:begin init
  test:generator:
    desc: Exercise initialized projects and multiple generated resources (requires Postgres)
    deps: [setup]
    cmds:
      - go test -tags generator -count=1 ./cmd/forge
  # forge:end init

  build:
    desc: Build api, migrate and forge into ./bin
    # Static binaries for the distroless image. Not global: the test tasks use
    # -race, which requires cgo.
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/{{.BINARY}}{{.EXT}} {{.PKG}}
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/migrate{{.EXT}} ./cmd/migrate
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/forge{{.EXT}} ./cmd/forge

  run:
    desc: Run the service
    cmds:
      - go run {{.PKG}}

  dev:
    desc: Run the service with live reload
    deps: [setup]
    cmds:
      - '{{.TOOLS}}/air{{.EXT}} -build.bin "./tmp/api{{.EXT}}"'

  migrate:
    desc: Apply database migrations
    cmds:
      - go run ./cmd/migrate up

  up:
    desc: Start the service and Postgres with docker compose
    dir: deployments
    cmds:
      - docker compose up --build -d

  down:
    desc: Stop the docker compose stack and preserve the database volume
    dir: deployments
    cmds:
      - docker compose --profile "*" down

  reset:
    desc: Stop the docker compose stack and DELETE its database volume
    dir: deployments
    cmds:
      - docker compose --profile "*" down -v

  # forge:begin otlp
  observe:
    desc: Start the full stack including the OpenTelemetry and Grafana observability tools
    dir: deployments
    env:
      FORGE_OTEL_OTLP_ENDPOINT: otel-collector:4317
    cmds:
      - docker compose --profile observability up --build -d
  # forge:end otlp

  tidy:
    desc: Tidy both modules
    cmds:
      - go mod tidy
      - go -C tools mod tidy

  ci:
    desc: Run all local gates including race, Postgres, vulnerability and container checks
    cmds:
      - go run ./cmd/dev ci

version: 2
project_name: gophling

release:
  # forge:begin init
  header: |
    Read the [upgrade notes](https://github.com/y0f/gophling/blob/{{ .Tag }}/CHANGELOG.md)
    before updating an existing project.
  # forge:end init
  # The workflow verifies uploaded assets before publishing this draft.
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
  preflight:
    fail_on_error: true

before:
  hooks:
    - go mod tidy

builds:
  - id: api
    main: ./cmd/api
    binary: api
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/y0f/gophling/v2/internal/config.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: migrate
    main: ./cmd/migrate
    binary: migrate
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/y0f/gophling/v2/internal/config.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: forge
    main: ./cmd/forge
    binary: forge
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # forge:begin init
    ldflags:
      - -s -w -X main.scaffoldVersion={{ .Tag }}
    # forge:end init
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - --yes
      - --bundle=${artifact}.bundle
      - ${artifact}

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: "^feat"
    - title: Fixes
      regexp: "^fix"
  filters:
    exclude:
      - '^(docs|test|chore|ci)(\([^)]+\))?:'
      - '^build\(deps[^)]*\):'
